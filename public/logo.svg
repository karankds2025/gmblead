<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5E3C" />
      <stop offset="100%" stop-color="#4A3525" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBC8" />
      <stop offset="100%" stop-color="#D5C2AD" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#382820" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Badge -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#brandGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Radar Waves -->
  <circle cx="50" cy="50" r="32" stroke="url(#radarGrad)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="50" cy="50" r="22" stroke="url(#radarGrad)" stroke-width="2.5" opacity="0.6" />
  
  <!-- Radar Sweep Center -->
  <circle cx="50" cy="50" r="10" fill="#EADBC8" />
  <circle cx="50" cy="50" r="5" fill="#6F4E37" />

  <!-- Target Marker / Pin Tip on top right -->
  <circle cx="68" cy="32" r="4.5" fill="#FCECE8" stroke="#943621" stroke-width="2" />
  <path d="M68 36.5 L68 41" stroke="#943621" stroke-width="2" stroke-linecap="round" />
</svg>
